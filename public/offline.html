<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline | NONI</title>
    <style>
      :root { --bg: #fff; --fg: #0a0a0a; --muted: #6b6b6b; --line: #d9d9d9; --accent: #c8ff00; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --fg: #f5f5f5; --muted: #9a9a9a; --line: #2a2a2a; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1rem; background: var(--bg); color: var(--fg); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { width: 100%; max-width: 30rem; border: 1px solid var(--line); padding: 1.5rem; }
      .eyebrow { display: flex; align-items: center; gap: 0.5rem; margin: 0; font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
      .eyebrow i { width: 0.5rem; height: 0.5rem; background: var(--accent); }
      h1 { margin: 0.75rem 0 0; font-size: 2.25rem; line-height: 1.05; letter-spacing: -0.02em; }
      p { margin: 0.75rem 0 0; font-size: 0.9rem; line-height: 1.6; color: var(--muted); }
      a { display: inline-flex; align-items: center; margin-top: 1.5rem; height: 2.75rem; padding: 0 1.5rem; border: 1px solid var(--fg); background: var(--fg); color: var(--bg); font-weight: 600; font-size: 0.9rem; text-decoration: none; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow"><i></i>NONI</p>
      <h1>You are offline</h1>
      <p>Rankings, battles and leaderboards need a connection. Check your network and try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
